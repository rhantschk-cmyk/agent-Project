[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultagent-cli"
version = "0.5.0"
description = "VaultAgent command-line tool for the Standard and Pro editions"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["vaultagent", "ai", "email", "agent", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
agent-cli = "cli.agent_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["cli", "cli.*", "install", "install.*"]